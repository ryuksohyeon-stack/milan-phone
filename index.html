<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밀란 바실리치의 휴대전화</title>
<style>
:root{--ac:#3d6a8c;--bg:#eef1f4;--cd:#fff;--tx:#1d252d;--sb:#6b7783;--ln:#dde2e7;--rd:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#12161a;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Roboto,sans-serif;color:var(--tx)}
#phone{position:relative;height:100vh;height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
button,[data-act]{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{border:0;background:none;font:inherit;color:inherit}
[data-act]:active{transform:scale(.96);opacity:.8}
#status{position:absolute;top:0;left:0;right:0;height:30px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(#0008,#0000);pointer-events:none}
#status .l,#status .r{display:flex;gap:6px;align-items:center}
#status .ic{font-size:10px;opacity:.9}
.bat{display:inline-block;width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
.bat i{position:absolute;left:1px;top:1px;bottom:1px;width:23%;background:#ff6b5e;border-radius:1px}
#nav{position:absolute;bottom:0;left:0;right:0;height:50px;z-index:100;display:flex;justify-content:space-around;align-items:center;background:#0d1114;color:#fff}
#nav button{width:33%;height:50px;min-width:44px;font-size:20px}
.screen{position:absolute;top:0;bottom:50px;left:0;right:0;background:var(--bg);transform:translateX(100%);visibility:hidden;pointer-events:none;transition:transform .26s ease,visibility 0s .26s;overflow:hidden}
.screen.behind{transform:translateX(-18%);visibility:visible;transition:transform .26s ease}
.screen.active{transform:none;visibility:visible;pointer-events:auto;transition:transform .26s ease,visibility 0s}
#s-home{background:linear-gradient(165deg,#a3adb8 0%,#65717d 50%,#2b333b 100%)}
#s-home::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 20%,#fff3 0,#0000 35%),radial-gradient(circle at 20% 90%,#0006 0,#0000 50%);pointer-events:none}
.hd{position:absolute;top:30px;left:0;right:0;height:50px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--cd);border-bottom:1px solid var(--ln);z-index:2}
.hd .b{width:44px;height:44px;font-size:30px;color:var(--ac)}
.hd h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ex{font-size:12px;color:var(--sb);padding-right:8px}
.bd{position:absolute;top:80px;bottom:0;left:0;right:0;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.screen:not(#s-home)::before{content:"";position:absolute;top:0;left:0;right:0;height:30px;background:#0d1114}
.card{background:var(--cd);border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px;line-height:1.5;word-break:break-word}
.card h3{font-size:14px;color:var(--ac);margin-bottom:4px}
.sm{font-size:12px;color:var(--sb);line-height:1.45}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--ln);width:100%;text-align:left}
.rows{border-radius:14px;overflow:hidden;margin-bottom:10px}
.row .av{width:40px;height:40px;border-radius:50%;background:#dfe6ec;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:12.5px;color:var(--sb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-size:12px;color:var(--sb);text-align:right;flex:none;max-width:35%}
.bg{background:var(--ac);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
.bgm{background:#9aa5b0}
.sec{font-size:12px;color:var(--sb);margin:10px 4px 6px;font-weight:700}
/* home */
.pages{position:absolute;top:34px;bottom:118px;left:0;right:0;overflow:hidden}
.pg{position:absolute;inset:0;padding:8px 14px;transform:translateX(100%);transition:transform .25s;visibility:hidden;pointer-events:none}
.pg.on{transform:none;visibility:visible;pointer-events:auto}.pg.off{transform:translateX(-100%)}
.wd{background:#ffffffd9;border-radius:20px;padding:14px;margin-bottom:14px;display:block;width:100%;text-align:left;color:var(--tx)}
.wd .t{font-size:13px;color:var(--sb)}.wd .big{font-size:36px;font-weight:300}.wd .s{font-size:13px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.ap{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11.5px;text-shadow:0 1px 3px #000a;min-height:44px;background:none;width:100%}
.ic2{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;box-shadow:0 2px 6px #0005}
.ic2 .nb{position:absolute;top:-5px;right:-5px;background:#e04b3a;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;text-shadow:none}
.fold{background:#ffffff40;flex-wrap:wrap;display:flex;gap:3px;padding:6px;justify-content:center;align-content:center}
.fold i{font-style:normal;font-size:15px;width:20px;height:20px;text-align:center}
.dots{position:absolute;bottom:128px;left:0;right:0;display:flex;justify-content:center;z-index:3}
.dots button{width:44px;height:30px;display:flex;align-items:center;justify-content:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff6}.dots button.on::after{background:#fff}
.dock{position:absolute;bottom:8px;left:10px;right:10px;height:82px;background:#ffffff38;border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;z-index:3}
.dock .ap{font-size:0}
/* chat */
.msgs{display:flex;flex-direction:column;gap:5px;padding-bottom:70px}
.bub{max-width:82%;padding:8px 11px;border-radius:16px;font-size:14.5px;line-height:1.4;word-break:break-word}
.bub small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.bub .tm{font-size:10.5px;opacity:.6;margin-top:2px;display:block}
.bub.m{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub.o{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.bub .nm{font-size:11.5px;font-weight:700;color:var(--ac);display:block}
.dt{align-self:center;background:#cfd6dd;border-radius:10px;padding:3px 12px;font-size:12px;color:#44505b;margin:8px 0 2px}
.nt{align-self:center;background:#fff8d6;border-radius:10px;padding:6px 10px;font-size:12px;color:#5b5120;max-width:90%;text-align:center;line-height:1.4}
.inp{position:absolute;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:6px 10px;z-index:3}
.inp .f{flex:1;height:40px;border-radius:20px;background:var(--bg);color:var(--sb);display:flex;align-items:center;padding:0 14px;font-size:14px}
.inp .sd{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;font-size:18px}
/* gallery */
.ghd{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:12px;overflow:hidden;margin-bottom:10px}
.ph{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:#fff;position:relative;min-height:44px}
.ph small{position:absolute;bottom:3px;left:4px;font-size:10px;text-shadow:0 1px 2px #000}.ph .st{position:absolute;top:3px;right:4px;font-size:12px}
.big-ph{aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:10px}
/* misc */
.tg{width:50px;height:30px;border-radius:15px;background:#b8c1ca;position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.row.off .m b{color:#98a2ac}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--cd);border-radius:14px;padding:8px;margin-bottom:10px}
.cal .h{text-align:center;font-size:11px;color:var(--sb);padding:4px 0}
.cal button{min-height:44px;border-radius:10px;font-size:14px;position:relative}
.cal button.ev::after{content:"";position:absolute;bottom:5px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.cal button.red{background:#f6d4d0;color:var(--rd);font-weight:700}.cal button.td{background:var(--ac);color:#fff}
.bar{height:10px;border-radius:5px;background:#dde2e7;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.prog{height:5px;background:#dde2e7;border-radius:3px;overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;width:94%;background:var(--ac)}
.pb{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px;display:block;margin:6px auto}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ac);color:#fff;font-size:14px;margin-top:8px}
#toast{position:absolute;left:14px;right:14px;bottom:66px;z-index:200;background:#12181dee;color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none}
#toast.on{opacity:1;transform:none}
s{color:#8a949e}
@media (max-width:360px){.grid{gap:10px 2px}.ic2{width:48px;height:48px;font-size:24px}.ap{font-size:10.5px}}
</style>
</head>

  }).join('') + '</div><div class="card"><h3>메모</h3>Мама — 최근 1년 내 통화 기록 0건. 저장명 해설은 연락처 앱에 있다.<br><button class="btn" data-act="open:contacts">연락처 열기</button></div>');

  /* gallery */
  function grad(g) { var a = g.split(','); return 'background:linear-gradient(145deg,' + a[0] + ',' + a[1] + ')'; }
  B('gallery', '<div class="card"><b>사진 2,341장 / 동영상 118개</b><div class="sm">앨범 정리는 사실상 안 함. 기본 앨범(카메라·스크린샷·텔레그램·VK) 외에 직접 만든 앨범은 3개.</div></div>' +
    '<div class="sec">직접 만든 앨범</div><div class="rows">' + AL.map(function (a, i) { return row('alb:' + i, '📁', esc(a[0]), esc(a[1]), '›'); }).join('') + '</div>' +
    '<div class="sec">최근 사진 (최신순)</div><div class="ghd">' + PH.map(function (p, i) { return '<button class="ph" data-act="ph:' + i + '" style="' + grad(p[5]) + '">' + p[1] + '<small>' + esc(p[0]) + '</small>' + (p[4] ? '<span class="st">⭐</span>' : '') + '</button>'; }).join('') + '</div>' +
    '<div class="card sm">⚠️ 11월 28일 유리 통화 스크린샷 이후, 바로 30일 밤 가로등 사진으로 넘어간다. 그 사이에 «분명 찍었던 것 같은» 사진들 — 보석방 진열장, 안전모 쓴 리카와 찍은 셀카, 과자 집, 전나무 트리 — 은 어디에도 없다. 갤러리를 3번 새로고침했고 클라우드 백업까지 뒤졌다. 그 뒤로는 11월 30일 이전으로 잘 스크롤하지 않는다.</div>' +
    '<div class="sec">동영상</div><div class="rows">' + VID.map(function (v, i) { return row('vid:' + i, '🎞️', esc(v[0]), '', '›'); }).join('') + '</div>' +
    '<div class="sec">스크린샷</div><div class="rows">' + SHOT.map(function (v, i) { return row('shot:' + i, '📱', esc(v[0]), '', '›'); }).join('') + '</div>');

  /* notes */
  B('notes', '<div class="rows">' + NOTES.map(function (n, i) { return row('note:' + i, '📝', esc(n[0]), esc(n[1] || '메모'), '›'); }).join('') + '</div><div class="sm" style="padding:0 6px">Google Keep</div>');

  /* browser */
  B('browser', '<div class="sec">최근 검색어 (최신순)</div><div class="rows">' + QRY.map(function (q, i) { return row(toastAttr(q[1]), '🔎', esc(q[0]), esc(q[1]), ''); }).join('') + '</div>' +
    '<div class="sec">북마크</div><div class="rows">' + BM.map(function (b) { return row(toastAttr(b[1] || '북마크한 페이지'), '📌', esc(b[0]), esc(b[1].slice(0, 28)), ''); }).join('') + '</div>' +
    '<div class="sec">열려 있는 탭 9개</div><div class="rows">' + TABS.map(function (t) { return row(toastAttr(t), '🗂️', esc(t), '', ''); }).join('') + '</div>');

  /* music */
  B('music', '<div class="card" style="text-align:center"><div style="font-size:48px">🌑</div><b>Молчат Дома – «Судно (Борис Рыжий)»</b><div class="sm">어젯밤 욕실 가기 전에 멈췄다. 9초만 들으면 끝나는데 아직 안 들었다.</div><div class="prog"><i id="mp"></i></div><div class="sm" id="mt">2:21 / 2:30 · 일시정지</div><button class="pb" id="pbtn" data-act="play">▶</button></div>' +
    '<div class="sec">최근 재생 (최신순)</div><div class="rows">' + RECENT.map(function (r, i) { return row(toastAttr(r), '🎵', esc(r.split(' ←')[0]), esc(r.indexOf('←') > 0 ? r.split('← ')[1] : ''), ''); }).join('') + '</div>' +
    '<div class="sec">플레이리스트</div><div class="rows">' + PLS.map(function (p) { return row(toastAttr(p[2]), p[0], esc(p[1]), esc(p[2]), ''); }).join('') + '</div>' +
    '<div class="card sm">플러스 구독 중, 월 169루블. «좋아요» 1,412곡. «Мой Вайб» 추천에 러시아 발라드가 섞여 나오기 시작해서 매번 «싫어요»를 누르고 있다. «Lovesong»을 6번 돌린 대가다.</div>');

  /* alarm */
  B('alarm', '<div class="rows">' + ALM.map(function (a, i) {
    return '<button class="row' + (a[2] ? '' : ' off') + '" id="al' + i + '" data-act="alm:' + i + '"><span class="m"><b style="font-size:26px;font-weight:300">' + a[0] + '</b><span>' + esc(a[1]) + '</span></span><span class="tg' + (a[2] ? ' on' : '') + '"></span></button>';
  }).join('') + '</div><div class="card sm">알람 소리는 전부 기본음 «Утро (아침)». 바꾸는 법을 모른다. 배우고 싶지도 않다.</div>');

  /* cart */
  B('cart', '<div class="rows">' + CART.map(function (c, i) {
    return row('cart:' + i, '🛍️', esc(c[0]), esc(c[2] + ' 담음'), '<b>' + esc(c[1]) + '</b>');
  }).join('') + '</div><div class="card"><b>합계 7,230₽</b> (+이어폰 1개분)<div class="sm">결제 버튼 바로 위에서 3일째 멈춰 있다. 주인의 결단력 문제다.</div><button class="btn" data-act="' + toastAttr('결제는 주인이 직접 해야 한다. 3일째 망설이는 중.') + '">결제하기</button></div>');

  /* calendar */
  (function () {
    var h = '<div class="card" style="margin-bottom:6px"><b>2020년 12월</b></div><div class="cal">' + ['월', '화', '수', '목', '금', '토', '일'].map(function (d) { return '<div class="h">' + d + '</div>'; }).join('');
    h += '<span></span>';
    for (var d = 1; d <= 31; d++) {
      var cls = (CAL[d] ? 'ev ' : '') + (d === 31 ? 'red ' : '') + (d === 4 ? 'td' : '');
      h += '<button class="' + cls + '" data-act="day:' + d + '">' + d + '</button>';
    }
    h += '</div><div class="sec">다른 일정</div><div class="rows">' +
      row(toastAttr('아직 비어 있다. 검색 기록에 «ресторан норильск забронировать» (노릴스크 레스토랑 예약)가 12월 1일 새벽에 찍혀 있다.'), '📅', '1월 7일 (목)', '아직 비어 있음', '') +
      row(toastAttr('이것만 적혀 있다. 그 앞뒤 날짜엔 아무것도 없다. 1월 14일 칸에 일정을 추가하려다 그냥 닫은 기록이 3번 남아 있다.'), '☀️', '1월 13일', '☀️', '') +
      row(toastAttr('«ДР» (생일). 자동 생성. 본인이 지울 줄 몰라서 남아 있다.'), '🎂', '2월 1일', 'ДР (생일)', '') + '</div>';
    B('calendar', h);
  })();

  /* settings */
  B('settings', SET.map(function (s) { return '<div class="card"><h3>' + s[0] + '</h3>' + s[1] + '</div>'; }).join(''));

  /* notif */
  B('notif', '<div class="sm" style="margin:0 4px 8px">오전 7:52 현재</div>' + NOTIF.map(function (n) { return '<button class="card" style="display:block;width:100%;text-align:left" data-act="' + toastAttr(n[2]) + '"><div class="sm">' + esc(n[0]) + ' · ' + esc(n[1]) + '</div>' + esc(n[2]) + '</button>'; }).join('') +
    '<div class="card sm">«낙하물 주의» 알림은 매일 아침 뜨는데, 밀란은 이걸 볼 때마다 속으로 같은 욕을 한다. 〈Заполярный вестник〉 속보는 7시 15분에 떴지만 아직 열어보지 않았다.</div>');

  /* contacts */
  B('contacts', '<div class="rows">' + CONT.map(function (c) { return row(toastAttr(c[2]), c[0], esc(c[1]), esc(c[2]), ''); }).join('') + '</div>');

  /* recorder */
  B('rec', '<div class="rows">' + row(toastAttr('내용: 밤새 통화하던 중 스피커폰 너머로 들린 숨소리를 녹음 앱이 실수로 따 버린 것… 이라고 본인은 주장한다. 녹음 버튼은 화면 정중앙에 있고, 실수로 누르기 꽤 어렵다.'), '🎙️', 'тест (테스트)', '12월 2일 오후 11:17', '4:06') +
    row(toastAttr('기타 연습 녹음 파일. 대부분 〈Группа крови〉 인트로를 치다가 틀리고 «блядь»로 끝난다.'), '🎸', '기타 연습 녹음 41개', '날짜로만 저장', '평균 0:47') + '</div>');

  /* ---------- NAVIGATION ---------- */
  var stack = ['home'];
  function render() {
    var top = stack[stack.length - 1];
    document.querySelectorAll('.screen').forEach(function (el) {
      var id = el.id.slice(2), i = stack.indexOf(id);
      el.classList.toggle('active', id === top);
      el.classList.toggle('behind', i >= 0 && id !== top);
      el.style.zIndex = i >= 0 ? 10 + i : 1;
    });
  }
  function openScreen(id) {
    if (!$('#s-' + id)) return;
    if (stack[stack.length - 1] === id) return;
    stack = stack.filter(function (x) { return x !== id; });
    stack.push(id); render();
  }
  function goBack() { if (stack.length > 1) { stack.pop(); render(); } else { toast('이미 홈 화면이다.'); } }
  function goHome() { stack = ['home']; render(); }
  function setDetail(title, html) { T('detail', title); B('detail', html); }
  var tt;
  function toast(t) {
    var e = $('#toast'); if (!e) return;
    e.textContent = t; e.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('on'); }, 3200);
  }
  function setPage(n) {
    [0, 1].forEach(function (i) {
      var p = $('#pg' + i); p.classList.toggle('on', i === n); p.classList.toggle('off', i < n);
    });
    document.querySelectorAll('.dots button').forEach(function (b, i) { b.classList.toggle('on', i === n); });
  }

  /* ---------- MUSIC STATE ---------- */
  var sec = 141, playing = false, mi = null;
  function mm(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function updMusic() {
    var p = $('#mp'), t = $('#mt'), b = $('#pbtn');
    if (p) p.style.width = (sec / 150 * 100) + '%';
    if (t) t.textContent = mm(sec) + ' / 2:30 · ' + (playing ? '재생 중' : (sec >= 150 ? '끝' : '일시정지'));
    if (b) b.textContent = playing ? '❚❚' : '▶';
  }
  function togglePlay() {
    if (sec >= 150) sec = 0;
    playing = !playing;
    clearInterval(mi);
    if (playing) mi = setInterval(function () { sec++; if (sec >= 150) { sec = 150; playing = false; clearInterval(mi); } updMusic(); }, 1000);
    updMusic();
  }
  updMusic();

  /* ---------- CLICK DELEGATION ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var raw = t.getAttribute('data-act'), k = raw.split(':')[0], v = raw.slice(k.length + 1), n = parseInt(v, 10);
    try {
      if (k === 'back') goBack();
      else if (k === 'home') goHome();
      else if (k === 'recent') toast('멀티태스킹 창에 앱이 40개쯤 떠 있다. 하나도 종료한 적 없다.');
      else if (k === 'toast') toast(t.getAttribute('data-t') || '');
      else if (k === 'page') setPage(n);
      else if (k === 'open') {
        if (v === 'weather') { setDetail('Яндекс Погода', '<div class="card"><div style="font-size:42px;font-weight:300">−31°C</div>카예르칸 −31°C, 눈보라 주의보. 일출: 없음.<div class="sm">매일 아침 «일출: 없음»을 보고 혼잣말로 욕을 한다.</div></div><div class="card"><h3>캡처된 화면 (12월 1일)</h3>«Полярная ночь началась. Следующий восход — 13 января»</div>'); openScreen('detail'); }
        else openScreen(v);
      }
      else if (k === 'chat') { renderChat(n); openScreen('chat'); }
      else if (k === 'app') { var a = APPS[v]; if (a) { setDetail(a[1], '<div class="card" style="text-align:center"><span class="ic2" style="background:' + a[2] + ';margin:0 auto 8px">' + a[0] + '</span><b>' + esc(a[1]) + '</b></div><div class="card">' + a[3] + '</div>'); openScreen('detail'); } }
      else if (k === 'folder') { var f = FOLD[v]; if (f) { T('folder', f[2] + ' ' + f[0]); B('folder', '<div class="rows">' + f[1].map(function (x) { return row('app:' + x, APPS[x][0], esc(APPS[x][1]), esc(APPS[x][3].replace(/<[^>]+>/g, ' ').slice(0, 40)), '›'); }).join('') + '</div>'); openScreen('folder'); } }
      else if (k === 'ph') { var p = PH[n]; if (p) { setDetail(p[2], '<div class="big-ph" style="' + grad(p[5]) + '">' + p[1] + '</div><div class="card"><b>' + esc(p[2]) + '</b> ' + (p[4] ? '⭐' : '') + '<div class="sm">' + esc(p[0]) + '</div><br>' + esc(p[3]) + '</div>'); openScreen('detail'); } }
      else if (k === 'alb') { var al = AL[n]; if (al) { setDetail(al[0], '<div class="card"><h3>' + esc(al[1]) + '</h3>' + esc(al[2]) + '</div>'); openScreen('detail'); } }
      else if (k === 'vid') { var vd = VID[n]; if (vd) { setDetail(vd[0], '<div class="big-ph" style="background:#2f3a44;color:#fff">▶️</div><div class="card">' + esc(vd[1]) + '</div>'); openScreen('detail'); } }
      else if (k === 'shot') { var sh = SHOT[n]; if (sh) { setDetail(sh[0], '<div class="card"><h3>스크린샷</h3>' + sh[1] + '</div>'); openScreen('detail'); } }
      else if (k === 'note') { var nt = NOTES[n]; if (nt) { setDetail(nt[0], '<div class="card" style="background:#fff8d6"><div class="sm">' + esc(nt[1] ? '최종 수정: ' + nt[1] : '') + '</div><br>' + fmt(nt[2]) + '</div>' + (nt[3] ? '<div class="card sm">' + esc(nt[3]) + '</div>' : '')); openScreen('detail'); } }
      else if (k === 'play') togglePlay();
      else if (k === 'alm') {
        var al2 = ALM[n]; if (al2) { al2[2] = al2[2] ? 0 : 1; var r = $('#al' + n); if (r) { r.classList.toggle('off', !al2[2]); r.querySelector('.tg').classList.toggle('on', !!al2[2]); } toast(al2[0] + ' ' + (al2[2] ? '🔔 ON' : '🔕 OFF') + ' — ' + al2[3]); }
      }
      else if (k === 'cart') { var c = CART[n]; if (c) toast(c[0] + ' · ' + c[3]); }
      else if (k === 'day') { toast('12월 ' + n + '일 — ' + (CAL[n] || '일정 없음')); }
    } catch (err) { try { toast('오류가 났지만 계속 사용할 수 있다.'); } catch (e2) {} }
  });

  /* swipe on home pages */
  (function () {
    var sx = null, pg = $('.pages');
    if (!pg) return;
    pg.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    pg.addEventListener('touchend', function (e) {
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (dx < -50) setPage(1); else if (dx > 50) setPage(0);
    }, { passive: true });
  })();

  /* ---------- CLOCK (장식, 오류 격리) ---------- */
  var t0 = Date.now();
  function tick() {
    try {
      var m = 7 * 60 + 52 + Math.floor((Date.now() - t0) / 60000);
      var el = $('#clock'); if (el) el.textContent = ('0' + (Math.floor(m / 60) % 24)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);
    } catch (e) {}
  }
  tick(); setInterval(tick, 5000);
  render();
});
</script>
</body>
</html>
